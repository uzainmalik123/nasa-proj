name: pipeline

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      place_limit:
        description: "Ingest only the N most populous places (0 = all; PRD §10 POWER fallback)"
        default: "0"
        required: false
      power_workers:
        description: "Parallel POWER requests (global pace stays POWER_PACE_S)"
        default: "2"
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      PLACE_LIMIT: ${{ github.event.inputs.place_limit || '0' }}
      POWER_WORKERS: ${{ github.event.inputs.power_workers || '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Sync dependencies
        working-directory: pipeline
        run: uv sync --frozen

      - name: Restore cache from the data branch
        run: |
          set -euo pipefail
          mkdir -p pipeline/data/cache pipeline/data/out
          if git fetch --depth=1 origin data 2>/dev/null; then
            git --work-tree=pipeline/data checkout origin/data -- cache out 2>/dev/null || true
            git --work-tree=pipeline/data checkout origin/data -- places.parquet 2>/dev/null || true
            git reset -q
            echo "restored $(find pipeline/data/cache -type f | wc -l) cache files"
          else
            echo "no data branch yet; cold run"
          fi

      - name: Run pipeline
        id: pipeline
        working-directory: pipeline
        run: uv run python run.py

      # run.json is written even when a stage or a gate failed (PRD §13.1)
      - name: Gate summary
        if: always()
        run: |
          set -euo pipefail
          f=pipeline/data/out/run.json
          if [ ! -f "$f" ]; then echo "no run.json written" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"## run {r['run_id']} · {'OK' if r['ok'] else 'FAILED'} · {r['duration_s']} s · {r['n_places']} places")
          if r.get("failed_gate") or r.get("failed_stage"):
              print(f"failed gate: `{r.get('failed_gate')}` · failed stage: `{r.get('failed_stage')}`\n")
          print("| gate | pass | value | detail |\n|---|---|---|---|")
          for k, g in r["gates"].items():
              mark = {True: "✅", False: "❌", None: "⏭"}[g["pass"]]
              print(f"| {k} | {mark} | {g['value']} | {g.get('detail', '')} |")
          m = r.get("metrics") or {}
          print(f"\nPR-AUC {m.get('pr_auc')} · baseline {m.get('baseline_pr_auc')} · Brier {m.get('brier')}")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Keep run.json of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            pipeline/data/out/run.json
            pipeline/data/out/honesty.json
            pipeline/data/out/freshness.json
          if-no-files-found: ignore

      # everything below runs only when every stage and every gate passed
      - name: Push data branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          mkdir -p "$stage/out" "$stage/cache"
          find pipeline/data/out -maxdepth 1 -name '*.json' -exec cp {} "$stage/out/" \; 2>/dev/null || true
          cp pipeline/data/places.parquet "$stage/" 2>/dev/null || true
          find pipeline/data/cache -name '*.parquet' -exec cp --parents {} "$stage/" \; 2>/dev/null || true
          # cp --parents keeps the pipeline/data/ prefix; flatten it
          if [ -d "$stage/pipeline/data/cache" ]; then
            cp -r "$stage/pipeline/data/cache/." "$stage/cache/"
            rm -rf "$stage/pipeline"
          fi
          mkdir -p "$stage/cache/firms"
          cp pipeline/data/cache/firms/_history.json "$stage/cache/firms/" 2>/dev/null || true
          echo "staging $(find "$stage" -type f | wc -l) files, $(du -sh "$stage" | cut -f1)"
          cd "$stage"
          git init -q -b data
          git config user.name "etd-pipeline[bot]"
          git config user.email "etd-pipeline@users.noreply.github.com"
          git add -A
          git commit -q -m "data: run $(date -u +%Y%m%dT%H%MZ)" --allow-empty
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: G7 · live run.json carries the new run id
        if: success()
        run: |
          set -euo pipefail
          want="$(python3 -c 'import json;print(json.load(open("pipeline/data/out/run.json"))["run_id"])')"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/out/run.json?v=${want}"
          for i in $(seq 1 18); do
            got="$(curl -fsSL "$url" | python3 -c 'import json,sys;print(json.load(sys.stdin)["run_id"])' || true)"
            if [ "$got" = "$want" ]; then
              echo "G7 pass: live run.json is $got"
              echo "G7_deploy: pass ($url)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "live run.json is '${got:-unreachable}', want $want (try $i)"; sleep 10
          done
          echo "G7 fail: live run.json never served $want" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Trigger deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
